<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Atollo — des statistiques web simples, lisibles et respectueuses de la vie privée."
    />
    <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080b1f" media="(prefers-color-scheme: dark)" />
    <!-- Link previews (LinkedIn, Slack…). The image needs an absolute URL: added at deployment. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Atollo" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:title"
      content="Atollo · Statistiques web multi-sites, simples et lisibles"
    />
    <meta
      property="og:description"
      content="Tous vos sites dans un seul tableau de bord : visiteurs, sources, pages, pays et appareils. Démo en un clic, sans inscription."
    />
    <link rel="icon" href="/favicon.ico" />
    <title>Atollo · Statistiques web multi-sites, simples et lisibles</title>
    <!--
      Applies the saved theme before the first paint, so a dark-mode user never
      sees a white flash while Vue loads. Same storage key as useTheme.ts.
    -->
    <script>
      try {
        const pref = localStorage.getItem('atollo-theme') || 'auto'
        const dark =
          pref === 'dark' ||
          (pref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
